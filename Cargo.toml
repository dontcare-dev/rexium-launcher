[package]
name = "rexium-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
urlencoding = "2"
rfd = "0.15"
zip = "2"
mc-launcher-core = "0.1.2"
open = "5"
which = "8"
