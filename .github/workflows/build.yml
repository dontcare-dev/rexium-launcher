name: Build Tensura Launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Static analysis
        run: cargo clippy --release -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Build Windows executable
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\\ISCC.exe" }
          if (-not (Test-Path $iscc)) { $iscc = Get-ChildItem "C:\\ProgramData\\chocolatey\\lib\\innosetup" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\\TensuraLauncher.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: TensuraLauncher-Windows
          path: |
            target/release/tensura-launcher.exe
            installer/output/TensuraLauncherSetup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/tensura-launcher.exe
            installer/output/TensuraLauncherSetup.exe
